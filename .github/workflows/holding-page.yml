# Publishes holding-page/ to GitHub Pages: a one-page fallback (address, timings, call/WhatsApp)
# for when Vercel is down, like the Hobby pause of 11 Nov 2026. It only runs by hand.
# To show it on the domain, the owner points DNS at GitHub Pages; to go back, points DNS back at Vercel.
name: Holding page

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: holding-page
      - id: deploy
        uses: actions/deploy-pages@v4
