<text x="104" y="512" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Research peptides: BPC-157, TB-500</text>
<text x="104" y="540" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Mostly animal data, no human safety record,</text><text x="104" y="563.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">sold as research use only</text><rect x="24" y="596" width="592" height="134" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-opacity="0.35" stroke-width="2"/>
