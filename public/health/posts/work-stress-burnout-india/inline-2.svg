<svg xmlns="http://www.w3.org/2000/svg" width="640" height="548" viewBox="0 0 640 548" role="img">
<rect width="640" height="548" rx="24" fill="#ffffff"/><rect width="640" height="10" fill="#312e81"/><rect x="0" y="10" width="640" height="4" fill="#5eead4"/>
<text x="28" y="62" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="900" fill="#0f172a" text-anchor="start">Warning signs of burnout</text>
<text x="28" y="102" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#475569" text-anchor="start">Look for patterns over weeks, not one bad day.</text>
<rect x="24" y="144" width="592" height="132" rx="18" fill="#f1f5f9" stroke="#312e81" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="184" r="24" fill="#ffffff"/><g transform="translate(50 170) scale(1.1666666666666667)" fill="none" stroke="#312e81" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></g>
<text x="104" y="182" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Body</text>
<text x="104" y="210" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Exhaustion sleep doesn't fix, headaches,</text><text x="104" y="233.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">stomach upsets, poor sleep, more caffeine or</text><text x="104" y="257.88" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">alcohol</text><rect x="24" y="290" width="592" height="108" rx="18" fill="#f1f5f9" stroke="#312e81" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="330" r="24" fill="#ffffff"/><g transform="translate(50 316) scale(1.1666666666666667)" fill="none" stroke="#312e81" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4a3 3 0 00-3 3 3 3 0 00-2 5 3 3 0 002 5 3 3 0 006 1V5a3 3 0 00-3-1zM15 4a3 3 0 013 3 3 3 0 012 5 3 3 0 01-2 5 3 3 0 01-6 1"/></g>
<text x="104" y="328" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Mind</text>
<text x="104" y="356" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Sunday-night dread, cynicism, numbness, poor</text><text x="104" y="379.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">concentration, more mistakes</text><rect x="24" y="412" width="592" height="108" rx="18" fill="#f1f5f9" stroke="#312e81" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="452" r="24" fill="#ffffff"/><g transform="translate(50 438) scale(1.1666666666666667)" fill="none" stroke="#312e81" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7a2 2 0 100-4 2 2 0 000 4zM17 7a2 2 0 100-4 2 2 0 000 4zM4 21v-8a3 3 0 016 0v8M14 21v-8a3 3 0 016 0v8"/></g>
<text x="104" y="450" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Behaviour</text>
<text x="104" y="478" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Withdrawing from people, procrastinating then</text><text x="104" y="501.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">working late, dropping exercise and hobbies</text>
</svg>