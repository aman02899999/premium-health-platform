<svg xmlns="http://www.w3.org/2000/svg" width="640" height="670" viewBox="0 0 640 670" role="img">
<rect width="640" height="670" rx="24" fill="#ffffff"/><rect width="640" height="10" fill="#78350f"/><rect x="0" y="10" width="640" height="4" fill="#a3e635"/>
<text x="28" y="62" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="900" fill="#0f172a" text-anchor="start">Indian fermented foods at a glance</text>
<text x="28" y="102" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#475569" text-anchor="start">Fermented doesn't always mean live microbes, and live</text><text x="28" y="125.4" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#475569" text-anchor="start">microbes don't always mean probiotic.</text>
<rect x="24" y="168" width="592" height="108" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="208" r="24" fill="#ffffff"/><g transform="translate(50 194) scale(1.1666666666666667)" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18a9 9 0 01-18 0zM8 7c0-1.5 1-2 1-3M12 7c0-1.5 1-2 1-3M16 7c0-1.5 1-2 1-3"/></g>
<text x="104" y="206" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Curd and buttermilk</text>
<text x="104" y="234" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Live cultures when fresh; also protein,</text><text x="104" y="257.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">calcium and B12</text><rect x="24" y="290" width="592" height="108" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="330" r="24" fill="#ffffff"/><g transform="translate(50 316) scale(1.1666666666666667)" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zm0 4a5 5 0 100 10 5 5 0 000-10z"/></g>
<text x="104" y="328" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Idli, dosa, dhokla</text>
<text x="104" y="356" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Fermented, then cooked: few live microbes, but</text><text x="104" y="379.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">easier to digest</text><rect x="24" y="412" width="592" height="108" rx="18" fill="#f1f5f9" stroke="#78350f" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="452" r="24" fill="#ffffff"/><g transform="translate(50 438) scale(1.1666666666666667)" fill="none" stroke="#78350f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/></g>
<text x="104" y="450" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Kanji</text>
<text x="104" y="478" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">May contain live microbes; little research;</text><text x="104" y="501.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">salty, so small glasses</text><rect x="24" y="534" width="592" height="108" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="574" r="24" fill="#ffffff"/><g transform="translate(50 560) scale(1.1666666666666667)" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2L12 3zM12 10v5M12 18h.01"/></g>
<text x="104" y="572" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Pickles</text>
<text x="104" y="600" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Often high in salt. A spoonful for flavour,</text><text x="104" y="623.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">not a health food</text>
</svg>