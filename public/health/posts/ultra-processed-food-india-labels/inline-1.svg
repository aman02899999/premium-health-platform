<svg xmlns="http://www.w3.org/2000/svg" width="640" height="694" viewBox="0 0 640 694" role="img">
<rect width="640" height="694" rx="24" fill="#ffffff"/><rect width="640" height="10" fill="#7c2d12"/><rect x="0" y="10" width="640" height="4" fill="#fde047"/>
<text x="28" y="62" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="900" fill="#0f172a" text-anchor="start">The 30-second label check</text>
<text x="28" y="102" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#475569" text-anchor="start">Turn the pack around. The ingredient list and per-100 g</text><text x="28" y="125.4" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#475569" text-anchor="start">table tell the real story.</text>
<rect x="24" y="168" width="592" height="108" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="208" r="24" fill="#ffffff"/><g transform="translate(50 194) scale(1.1666666666666667)" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2L12 3zM12 10v5M12 18h.01"/></g>
<text x="104" y="206" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Ignore the front</text>
<text x="104" y="234" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Healthy, multigrain, natural, baked not fried:</text><text x="104" y="257.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">these are marketing words</text><rect x="24" y="290" width="592" height="108" rx="18" fill="#f1f5f9" stroke="#7c2d12" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="330" r="24" fill="#ffffff"/><g transform="translate(50 316) scale(1.1666666666666667)" fill="none" stroke="#7c2d12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h9l7 7-9 9-7-7V4zM8 8h.01"/></g>
<text x="104" y="328" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Read the first three ingredients</text>
<text x="104" y="356" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Sugar, maida or oil among them means the food</text><text x="104" y="379.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">is built on them</text><rect x="24" y="412" width="592" height="132" rx="18" fill="#f1f5f9" stroke="#7c2d12" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="452" r="24" fill="#ffffff"/><g transform="translate(50 438) scale(1.1666666666666667)" fill="none" stroke="#7c2d12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/></g>
<text x="104" y="450" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Count the names for sugar</text>
<text x="104" y="478" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Invert syrup, liquid glucose, maltodextrin,</text><text x="104" y="501.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">dextrose, malt extract… two or more is a</text><text x="104" y="525.88" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">warning</text><rect x="24" y="558" width="592" height="108" rx="18" fill="#f1f5f9" stroke="#7c2d12" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="598" r="24" fill="#ffffff"/><g transform="translate(50 584) scale(1.1666666666666667)" fill="none" stroke="#7c2d12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M5 7h14M5 7l-3 6a3 3 0 006 0L5 7zM19 7l-3 6a3 3 0 006 0l-3-6"/></g>
<text x="104" y="596" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Check per 100 g</text>
<text x="104" y="624" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">UK yardstick: over 22.5 g sugar, 1.5 g salt or</text><text x="104" y="647.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">5 g saturated fat is high</text>
</svg>