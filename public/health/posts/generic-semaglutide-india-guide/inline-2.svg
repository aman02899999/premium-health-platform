<svg xmlns="http://www.w3.org/2000/svg" width="640" height="670" viewBox="0 0 640 670" role="img">
<rect width="640" height="670" rx="24" fill="#ffffff"/><rect width="640" height="10" fill="#0f4c5c"/><rect x="0" y="10" width="640" height="4" fill="#f4b942"/>
<text x="28" y="62" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="900" fill="#0f172a" text-anchor="start">Keep the muscle while the fat goes</text>
<text x="28" y="102" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#475569" text-anchor="start">Four habits that decide whether you lose mostly fat or a</text><text x="28" y="125.4" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#475569" text-anchor="start">lot of muscle too.</text>
<rect x="24" y="168" width="592" height="108" rx="18" fill="#f1f5f9" stroke="#0f4c5c" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="208" r="24" fill="#ffffff"/><g transform="translate(50 194) scale(1.1666666666666667)" fill="none" stroke="#0f4c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zm0 4a5 5 0 100 10 5 5 0 000-10z"/></g>
<text x="104" y="206" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Protein first</text>
<text x="104" y="234" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Dal, curd, paneer, eggs or soya at every meal,</text><text x="104" y="257.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">eaten before rice or roti</text><rect x="24" y="290" width="592" height="108" rx="18" fill="#f1f5f9" stroke="#0f4c5c" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="330" r="24" fill="#ffffff"/><g transform="translate(50 316) scale(1.1666666666666667)" fill="none" stroke="#0f4c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4M6 8v8M18 8v8M21 10v4M6 12h12"/></g>
<text x="104" y="328" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Lift 2–3 times a week</text>
<text x="104" y="356" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Squats, push-ups, rows and carries, adding</text><text x="104" y="379.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">weight slowly</text><rect x="24" y="412" width="592" height="108" rx="18" fill="#f1f5f9" stroke="#0f4c5c" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="452" r="24" fill="#ffffff"/><g transform="translate(50 438) scale(1.1666666666666667)" fill="none" stroke="#0f4c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/></g>
<text x="104" y="450" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Drink through the day</text>
<text x="104" y="478" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Small meals and nausea make dehydration easy,</text><text x="104" y="501.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">especially in summer</text><rect x="24" y="534" width="592" height="108" rx="18" fill="#f1f5f9" stroke="#0f4c5c" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="574" r="24" fill="#ffffff"/><g transform="translate(50 560) scale(1.1666666666666667)" fill="none" stroke="#0f4c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></g>
<text x="104" y="572" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Track strength monthly</text>
<text x="104" y="600" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Weight, waist and one lift. Falling strength</text><text x="104" y="623.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">means adjust the plan</text>
</svg>