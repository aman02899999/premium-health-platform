<text x="104" y="264" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Grip strength</text>
<text x="104" y="292" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Low if under 28 kg for men or under 18 kg for</text><text x="104" y="315.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">women (hand dynamometer)</text><rect x="24" y="348" width="592" height="108" rx="18" fill="#f1f5f9" stroke="#14532d" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="388" r="24" fill="#ffffff"/><g transform="translate(50 374) scale(1.1666666666666667)" fill="none" stroke="#14532d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zM12 7v5l3 2"/></g>
<text x="104" y="386" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Five chair stands</text>
<text x="104" y="414" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Low if it takes 12 seconds or more, arms</text><text x="104" y="437.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">crossed, no hands</text><rect x="24" y="470" width="592" height="108" rx="18" fill="#f1f5f9" stroke="#14532d" stroke-opacity="0.35" stroke-width="2"/>
