<svg xmlns="http://www.w3.org/2000/svg" width="640" height="818" viewBox="0 0 640 818" role="img">
<rect width="640" height="818" rx="24" fill="#ffffff"/><rect width="640" height="10" fill="#7f1d1d"/><rect x="0" y="10" width="640" height="4" fill="#fbbf24"/>
<text x="28" y="62" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="900" fill="#0f172a" text-anchor="start">Seven reasons iron tablets fail</text>
<text x="28" y="102" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#475569" text-anchor="start">Check each one with your doctor before deciding iron</text><text x="28" y="125.4" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#475569" text-anchor="start">'doesn't work' for you.</text>
<rect x="24" y="168" width="592" height="108" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="208" r="24" fill="#ffffff"/><g transform="translate(50 194) scale(1.1666666666666667)" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/></g>
<text x="104" y="206" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Not (only) iron</text>
<text x="104" y="234" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">B12, folate, thalassaemia trait or a chronic</text><text x="104" y="257.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">illness</text><rect x="24" y="290" width="592" height="84" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="330" r="24" fill="#ffffff"/><g transform="translate(50 316) scale(1.1666666666666667)" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13v5a6 6 0 01-6 6H10a6 6 0 01-6-6V8zM17 9h2a2 2 0 010 4h-2M8 3v2M12 3v2"/></g>
<text x="104" y="328" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Taken with chai or milk</text>
<text x="104" y="356" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Tea, coffee and calcium cut iron absorption</text><rect x="24" y="388" width="592" height="84" rx="18" fill="#f1f5f9" stroke="#7f1d1d" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="428" r="24" fill="#ffffff"/><g transform="translate(50 414) scale(1.1666666666666667)" fill="none" stroke="#7f1d1d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zM12 7v5l3 2"/></g>
<text x="104" y="426" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Stopped too early</text>
<text x="104" y="454" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Hb rises first; iron stores take much longer</text><rect x="24" y="486" width="592" height="108" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="526" r="24" fill="#ffffff"/><g transform="translate(50 512) scale(1.1666666666666667)" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2L12 3zM12 10v5M12 18h.01"/></g>
<text x="104" y="524" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Blood still leaking</text>
<text x="104" y="552" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Heavy periods, piles, ulcers, frequent</text><text x="104" y="575.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">donation</text><rect x="24" y="608" width="592" height="84" rx="18" fill="#f1f5f9" stroke="#7f1d1d" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="648" r="24" fill="#ffffff"/><g transform="translate(50 634) scale(1.1666666666666667)" fill="none" stroke="#7f1d1d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 6-14 15-14 0 9-6 15-14 15M5 19l8-8"/></g>
<text x="104" y="646" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Worms</text>
<text x="104" y="674" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Deworming as advised, especially for children</text><rect x="24" y="706" width="592" height="84" rx="18" fill="#f1f5f9" stroke="#7f1d1d" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="746" r="24" fill="#ffffff"/><g transform="translate(50 732) scale(1.1666666666666667)" fill="none" stroke="#7f1d1d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 21a5 5 0 01-7-7l11-11a5 5 0 017 7L10 21zM8.5 8.5l7 7"/></g>
<text x="104" y="744" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Poor absorption or side effects</text>
<text x="104" y="772" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Gut conditions, acid medicines, skipped doses</text>
</svg>