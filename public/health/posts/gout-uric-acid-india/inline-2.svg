<svg xmlns="http://www.w3.org/2000/svg" width="640" height="778" viewBox="0 0 640 778" role="img">
<rect width="640" height="778" rx="24" fill="#ffffff"/><rect width="640" height="10" fill="#4c1d95"/><rect x="0" y="10" width="640" height="4" fill="#fcd34d"/>
<text x="28" y="62" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="900" fill="#0f172a" text-anchor="start">Gout and food: what to limit,</text><text x="28" y="96.5" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="900" fill="#0f172a" text-anchor="start">what's fine</text>
<text x="28" y="136" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#475569" text-anchor="start">Alcohol, sugary drinks and big meat or seafood meals</text><text x="28" y="159.4" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#475569" text-anchor="start">matter more than dal.</text>
<rect x="24" y="202" width="592" height="84" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="242" r="24" fill="#ffffff"/><g transform="translate(50 228) scale(1.1666666666666667)" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13v5a6 6 0 01-6 6H10a6 6 0 01-6-6V8zM17 9h2a2 2 0 010 4h-2M8 3v2M12 3v2"/></g>
<text x="104" y="240" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Limit: alcohol</text>
<text x="104" y="268" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Especially beer, spirits and binge drinking</text><rect x="24" y="300" width="592" height="84" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="340" r="24" fill="#ffffff"/><g transform="translate(50 326) scale(1.1666666666666667)" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13v5a6 6 0 01-6 6H10a6 6 0 01-6-6V8zM17 9h2a2 2 0 010 4h-2M8 3v2M12 3v2"/></g>
<text x="104" y="338" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Limit: sugary drinks</text>
<text x="104" y="366" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Cold drinks, packaged juices, sweet lassi</text><rect x="24" y="398" width="592" height="108" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="438" r="24" fill="#ffffff"/><g transform="translate(50 424) scale(1.1666666666666667)" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zm0 4a5 5 0 100 10 5 5 0 000-10z"/></g>
<text x="104" y="436" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Limit: big meat and seafood meals</text>
<text x="104" y="464" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Mutton, organ meat and seafood, especially at</text><text x="104" y="487.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">parties</text><rect x="24" y="520" width="592" height="108" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="560" r="24" fill="#ffffff"/><g transform="translate(50 546) scale(1.1666666666666667)" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18a9 9 0 01-18 0zM8 7c0-1.5 1-2 1-3M12 7c0-1.5 1-2 1-3M16 7c0-1.5 1-2 1-3"/></g>
<text x="104" y="558" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Fine for most: dal and vegetables</text>
<text x="104" y="586" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Plant purines weren't linked with more gout in</text><text x="104" y="609.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">a large study</text><rect x="24" y="642" width="592" height="108" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="682" r="24" fill="#ffffff"/><g transform="translate(50 668) scale(1.1666666666666667)" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/></g>
<text x="104" y="680" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Helps: water and low-fat dairy</text>
<text x="104" y="708" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Water through the day; milk and curd were</text><text x="104" y="731.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">linked with less gout</text>
</svg>