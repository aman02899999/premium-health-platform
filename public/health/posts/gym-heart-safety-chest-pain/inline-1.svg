<svg xmlns="http://www.w3.org/2000/svg" width="640" height="802" viewBox="0 0 640 802" role="img">
<rect width="640" height="802" rx="24" fill="#ffffff"/><rect width="640" height="10" fill="#0c4a6e"/><rect x="0" y="10" width="640" height="4" fill="#fde047"/>
<text x="28" y="62" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="900" fill="#0f172a" text-anchor="start">Heart warning signs: stop and get</text><text x="28" y="96.5" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="900" fill="#0f172a" text-anchor="start">help</text>
<text x="28" y="136" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#475569" text-anchor="start">From the American Heart Association. If it lasts more</text><text x="28" y="159.4" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#475569" text-anchor="start">than a few minutes, call 112 or 108.</text>
<rect x="24" y="202" width="592" height="108" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="242" r="24" fill="#ffffff"/><g transform="translate(50 228) scale(1.1666666666666667)" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/></g>
<text x="104" y="240" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Chest pressure or pain</text>
<text x="104" y="268" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Squeezing, fullness, heaviness or burning in</text><text x="104" y="291.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">the centre of the chest</text><rect x="24" y="324" width="592" height="108" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="364" r="24" fill="#ffffff"/><g transform="translate(50 350) scale(1.1666666666666667)" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2L12 3zM12 10v5M12 18h.01"/></g>
<text x="104" y="362" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Pain that spreads</text>
<text x="104" y="390" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">To one or both arms, the back, neck, jaw or</text><text x="104" y="413.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">upper stomach</text><rect x="24" y="446" width="592" height="108" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="486" r="24" fill="#ffffff"/><g transform="translate(50 472) scale(1.1666666666666667)" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v8M12 12c-2 0-3-2-5-2-2.5 0-3 6-3 8 0 1.5 1 2 2 2 3 0 6-2 6-6M12 12c2 0 3-2 5-2 2.5 0 3 6 3 8 0 1.5-1 2-2 2-3 0-6-2-6-6"/></g>
<text x="104" y="484" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Breathlessness</text>
<text x="104" y="512" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">With or without chest pain, out of proportion</text><text x="104" y="535.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">to the effort</text><rect x="24" y="568" width="592" height="108" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="608" r="24" fill="#ffffff"/><g transform="translate(50 594) scale(1.1666666666666667)" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/></g>
<text x="104" y="606" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Cold sweat or nausea</text>
<text x="104" y="634" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Often mistaken for acidity, especially in</text><text x="104" y="657.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">women</text><rect x="24" y="690" width="592" height="84" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="730" r="24" fill="#ffffff"/><g transform="translate(50 716) scale(1.1666666666666667)" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zM12 7v5l3 2"/></g>
<text x="104" y="728" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Racing or irregular heartbeat</text>
<text x="104" y="756" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Or feeling lightheaded or unusually tired</text>
</svg>