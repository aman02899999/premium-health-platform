<svg xmlns="http://www.w3.org/2000/svg" width="640" height="996" viewBox="0 0 640 996" role="img">
<rect width="640" height="996" rx="24" fill="#ffffff"/><rect width="640" height="10" fill="#4a044e"/><rect x="0" y="10" width="640" height="4" fill="#facc15"/>
<text x="28" y="62" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="900" fill="#0f172a" text-anchor="start">What's in the tub, and why it's a</text><text x="28" y="96.5" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="900" fill="#0f172a" text-anchor="start">worry</text>
<text x="28" y="136" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#475569" text-anchor="start">Read every label. If amounts are hidden in a</text><text x="28" y="159.4" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#475569" text-anchor="start">'proprietary blend', skip it.</text>
<rect x="24" y="202" width="592" height="132" rx="18" fill="#f1f5f9" stroke="#4a044e" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="242" r="24" fill="#ffffff"/><g transform="translate(50 228) scale(1.1666666666666667)" fill="none" stroke="#4a044e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13v5a6 6 0 01-6 6H10a6 6 0 01-6-6V8zM17 9h2a2 2 0 010 4h-2M8 3v2M12 3v2"/></g>
<text x="104" y="240" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Caffeine</text>
<text x="104" y="268" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Small training boost. Add every source and</text><text x="104" y="291.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">stay within EFSA's 200 mg at once, 400 mg a</text><text x="104" y="315.88" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">day</text><rect x="24" y="348" width="592" height="132" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="388" r="24" fill="#ffffff"/><g transform="translate(50 374) scale(1.1666666666666667)" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2L12 3zM12 10v5M12 18h.01"/></g>
<text x="104" y="386" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">DMAA, DMHA, octodrine</text>
<text x="104" y="414" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">FDA-banned DMAA linked to heart risks;</text><text x="104" y="437.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">look-alikes have unknown safety. Prohibited in</text><text x="104" y="461.88" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">sport</text><rect x="24" y="494" width="592" height="108" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="534" r="24" fill="#ffffff"/><g transform="translate(50 520) scale(1.1666666666666667)" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/></g>
<text x="104" y="532" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Synephrine (bitter orange)</text>
<text x="104" y="560" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Raised blood pressure in a 2022 meta-analysis,</text><text x="104" y="583.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">with no proven weight loss</text><rect x="24" y="616" width="592" height="108" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="656" r="24" fill="#ffffff"/><g transform="translate(50 642) scale(1.1666666666666667)" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 21a5 5 0 01-7-7l11-11a5 5 0 017 7L10 21zM8.5 8.5l7 7"/></g>
<text x="104" y="654" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Yohimbine</text>
<text x="104" y="682" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Amounts ranged from none to drug-level, and</text><text x="104" y="705.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">most labels were wrong</text><rect x="24" y="738" width="592" height="108" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="778" r="24" fill="#ffffff"/><g transform="translate(50 764) scale(1.1666666666666667)" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 6-14 15-14 0 9-6 15-14 15M5 19l8-8"/></g>
<text x="104" y="776" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">Green tea extract, Garcinia</text>
<text x="104" y="804" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Flagged in liver-injury research. 'Herbal'</text><text x="104" y="827.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">doesn't mean safe</text><rect x="24" y="860" width="592" height="108" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="64" cy="900" r="24" fill="#ffffff"/><g transform="translate(50 886) scale(1.1666666666666667)" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4a2 2 0 100 4 2 2 0 000-4zM10 21l2-6 3 3v3M8 12l3-3 3 2 3 1M11 9l-1 5"/></g>
<text x="104" y="898" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">What works instead</text>
<text x="104" y="926" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Calorie deficit, protein at every meal,</text><text x="104" y="949.94" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#334155" text-anchor="start">lifting and more daily steps</text>
